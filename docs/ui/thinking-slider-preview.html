.detail{width:280px;padding:12px;border-radius:var(--radius-lg);corner-shape:superellipse(1.5);background:var(--menu-fill);box-shadow:var(--elevation-stroke),0 3px 8px var(--shadow-color-1),0 0 16px var(--shadow-color-2);display:grid;gap:12px;justify-items:center}

<main>
 <h1>推理强度动效预览</h1>
 <p>拖动选择档位，松开后吸附。</p>
 <section class="detail" aria-label="模型详情">
  <div class="identity"><strong class="level" id="level">高</strong><span>GPT 示例模型</span></div>
  <div class="slider" role="slider" tabindex="0" aria-label="推理强度" aria-valuemin="0" aria-valuemax="6" aria-valuenow="4" aria-valuetext="高">
   <div class="track"><div class="ticks"></div><div class="fill"><canvas aria-hidden="true"></canvas></div></div>
   <div class="thumb"></div>
  </div>
 </section>
 <label><input id="reduced" type="checkbox">减少动态效果</label>
 <p id="status" aria-live="polite">高 · 第 5 / 7 档</p>
</main>
<script>
// Design companion only. No model configuration or persistence is changed.
const levels=['关闭','最低','低','中','高','极高','最大'];
const slider=document.querySelector('.slider'),fill=document.querySelector('.fill'),thumb=document.querySelector('.thumb'),detail=document.querySelector('.detail'),label=document.querySelector('#level'),status=document.querySelector('#status');
const reduced=document.querySelector('#reduced'),preference=matchMedia('(prefers-reduced-motion: reduce)');
let value=4,dragging=false,motionReduced=false,frame=0;
let particlePhase=0,lastParticleTime=null;
const particleDurations=[Infinity,4,3,2.2,1.6,1.1,.75];
const ticks=levels.map((name,i)=>{const tick=document.createElement('i');tick.className='tick';tick.style.left=`${12+i*38}px`;document.querySelector('.ticks').append(tick);return tick});
function update(index,position=index*38){
 const previous=value;value=index;label.textContent=levels[index];slider.setAttribute('aria-valuenow',index);slider.setAttribute('aria-valuetext',levels[index]);
 fill.style.width=`${14+position}px`;fill.style.opacity=position>0?1:0;thumb.style.transform=`translateX(${position}px)`;
 detail.classList.toggle('off',index===0);status.textContent=`${levels[index]} · ${index===0?'无粒子':'每轮约 '+particleDurations[index]+' 秒'}`;if(index===0||previous===0)syncMotion();
}
function point(event){const x=Math.max(0,Math.min(228,event.clientX-slider.getBoundingClientRect().left-14));update(Math.round(x/38),x)}
slider.addEventListener('pointerdown',event=>{if(event.button!==0)return;dragging=true;slider.classList.add('dragging');slider.setPointerCapture(event.pointerId);slider.focus();point(event)});
slider.addEventListener('pointermove',event=>{if(dragging)point(event)});
function settle(){if(!dragging)return;dragging=false;slider.classList.remove('dragging');update(value)}
slider.addEventListener('pointerup',settle);slider.addEventListener('pointercancel',settle);slider.addEventListener('lostpointercapture',settle);
slider.addEventListener('keydown',event=>{let next=value;if(['ArrowRight','ArrowUp'].includes(event.key))next++;else if(['ArrowLeft','ArrowDown'].includes(event.key))next--;else if(event.key==='Home')next=0;else if(event.key==='End')next=6;else return;event.preventDefault();update(Math.max(0,Math.min(6,next)))});
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
function resize(){const dpr=devicePixelRatio||1;canvas.width=256*dpr;canvas.height=24*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();window.addEventListener('resize',resize);
const light=getComputedStyle(document.documentElement).getPropertyValue('--palette-white').trim();
function paint(time){ctx.clearRect(0,0,256,24);if(!motionReduced&&value>0){const elapsed=lastParticleTime===null?0:Math.min(.05,Math.max(0,(time-lastParticleTime)/1000));lastParticleTime=time;particlePhase+=elapsed/particleDurations[value];const span=fill.getBoundingClientRect().width;for(let i=0;i<[0,3,6,10,15,21,28][value];i++){const x=(((i*.618034-particlePhase*(1+.04*(i%3)))%1+1)%1)*span;const y=12+Math.sin(i*2.41+time*.0007)*6.72;ctx.globalAlpha=.35+.20*Math.sin(i+time*.0011);ctx.fillStyle=light;ctx.beginPath();ctx.arc(x,y,1.08+.43*(i%3),0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;if(!motionReduced&&!document.hidden&&value>0)frame=requestAnimationFrame(paint)}
function syncMotion(){lastParticleTime=null;motionReduced=preference.matches||reduced.checked;document.body.classList.toggle('reduced',motionReduced);cancelAnimationFrame(frame);paint(performance.now())}
reduced.addEventListener('change',syncMotion);preference.addEventListener('change',syncMotion);document.addEventListener('visibilitychange',syncMotion);update(4);syncMotion();
</script>
