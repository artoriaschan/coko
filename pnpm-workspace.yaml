packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
autoInstallPeers: false
saveExact: true

# strictDepBuilds 默认开启：未裁决的安装脚本会让安装失败。逐个放行或拒绝。
allowBuilds:
  electron: true
  # PTY 后端（apps/server）；安装脚本只在没有预编译产物时编译。spawn-helper 的可执行位由根 postinstall 恢复。
  node-pty: true
  # DMG maker（apps/desktop 的 make，只在构建机运行，不进安装包）：appdmg 用 fs-xattr 写扩展属性、ds-store 用 macos-alias 写 Applications 别名，
  # 两者都是只有 binding.gyp 的原生模块，安装时 node-gyp 编译；不放行时 make 加载失败。
  fs-xattr: true
  macos-alias: true
  koffi: false
  protobufjs: false
  '@google/genai': false

# 不把第三方包附带的 Agent skills 链接进仓库。
permissions:
  '@logtape/logtape':
    skills: false

overrides:
  '@earendil-works/pi-agent-core': 1.4.0
  '@earendil-works/pi-ai': 1.4.0
  '@earendil-works/pi-mcp': 1.4.0
  '@earendil-works/pi-telemetry': 1.4.0
  'typebox': 1.3.27
  'shiki': 4.5.0
  'katex': 0.16.47
  'mermaid': 11.17.2
