<h1>会话悬浮与置顶交互预览</h1>
<p class="intro">悬停查看详情；横向滚动或拖动长标题；点击置顶后观察分类变化。</p>
<div class="window"><aside id="sidebar" aria-label="会话与项目"></aside><section class="main"><div><h2 id="main-title">查看左侧会话与项目</h2><p id="main-copy">置顶后项目或对话会从原分类移入置顶分类。项目内对话的项目归属继续保留。</p></div></section></div>
<p class="status" id="status" role="status">示例数据仅在当前预览中变化</p>
<dialog id="rename"><form method="dialog"><h2>重命名会话</h2><input name="title" aria-label="会话名称" required><div class="dialog-actions"><button value="cancel" formnovalidate>取消</button><button value="save" class="primary">保存</button></div></form></dialog>
<dialog id="conversation-search" class="search-dialog" aria-label="搜索对话"><label class="search-field"><span id="search-field-icon" aria-hidden="true"></span><input id="conversation-query" type="text" placeholder="搜索对话…" aria-label="搜索对话标题" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="conversation-results" autocomplete="off"></label><section class="search-results-region"><h2 id="search-section-title" class="search-section-title">最近对话</h2><div id="conversation-results" class="search-results" role="listbox" aria-labelledby="search-section-title"></div><span id="search-count" role="status" aria-live="polite" style="position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden"></span></section></dialog>
<dialog id="project-delete" class="delete-confirm project-delete-confirm" aria-labelledby="delete-project-title" aria-describedby="delete-project-description"><header class="delete-header"><h2 id="delete-project-title">删除项目？</h2><button type="button" class="icon-button delete-close" aria-label="关闭删除确认"></button></header><p id="delete-project-description" class="delete-description">项目会从列表中移除，正在运行的对话会被停止。对话记录会保留，移到「对话」下；项目文件夹里的文件不会被删除。</p><p class="project-delete-error" role="alert" hidden></p><footer class="dialog-actions"><button type="button" class="delete-cancel">取消</button><button type="button" class="delete-confirm-button">删除</button></footer></dialog>

function toggleSessionPin(session){session.pinned=!session.pinned;sections.pinned=true;render();say(session.pinned?'已移入置顶分类，原分类不再显示此对话':'已取消置顶并恢复原分类');document.querySelector(`[data-session="${session.id}"] .pin-session`)?.focus()}

function item(label,name,action,danger=false){const button=document.createElement('button');button.className='menu-item'+(danger?' danger':'');button.innerHTML=icon(name)+`<span>${label}</span>`;button.onclick=event=>{event.stopPropagation();action()};return button}
function showMenu(session,button,point=null){closeFloats();const anchor=button.closest('.row')||button.closest('.search-result')||button;menu=document.createElement('div');menu.className='float menu';menu._sessionOrigin=anchor;menu.setAttribute('role','menu');

function showMoveMenu(session,trigger){submenu?.remove();submenu=document.createElement('div');submenu.className='float submenu';submenu.innerHTML=`<label class="search">${icon('search')}<input placeholder="搜索项目" aria-label="搜索项目"></label><div class="project-options"></div>`;const options=submenu.querySelector('.project-options');const fill=()=>{options.replaceChildren();const q=submenu.querySelector('input').value.toLowerCase();const filtered=projects.filter(p=>p.name.toLowerCase().includes(q));for(const p of filtered){const button=item(p.name,'folder-closed',()=>{session.project=p.id;render();if(conversationSearch.open)renderConversationResults();say('会话已移动到 '+p.name)});if(session.project===p.id)button.classList.add('selected');options.append(button)}if(!filtered.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='未找到匹配项目';options.append(empty)}options.append(document.createElement('hr'),item('选择文件夹…','folder-open',()=>openMoveProjectCreate(session,menu?._sessionOrigin)));if(session.project)options.append(item('移出项目','message-circle',()=>{session.project=null;render();if(conversationSearch.open)renderConversationResults();say('已移出项目，置顶状态保持不变')}))};fill();submenu.querySelector('input').oninput=fill;(menu.parentElement||document.body).append(submenu);const m=menu.getBoundingClientRect(),r=trigger.getBoundingClientRect();const preferred=r.right;const left=preferred+submenu.offsetWidth<=innerWidth-8?preferred:r.left-submenu.offsetWidth;submenu.style.left=Math.max(8,Math.min(innerWidth-submenu.offsetWidth-8,left))+'px';submenu.style.top=Math.max(8,Math.min(innerHeight-submenu.offsetHeight-8,r.top))+'px';submenu.querySelector('input').focus()}

function searchAgeOrder(age){const n=parseInt(age,10)||0;return n*(age.includes('天')?1440:age.includes('时')?60:1)}
function searchCorpus(){return [...new Map([...sessions,...searchExamples].filter(s=>!s.archived&&!s.parentSessionId).map(s=>[s.id,s])).values()].sort((a,b)=>searchAgeOrder(a.age)-searchAgeOrder(b.age))}
function highlightSearchTitle(title,query){if(!query)return safe(title);let result='',from=0;const normalized=title.toLocaleLowerCase(),needle=query.toLocaleLowerCase();for(let at=normalized.indexOf(needle);at!==-1;at=normalized.indexOf(needle,from)){result+=safe(title.slice(from,at))+'<mark>'+safe(title.slice(at,at+query.length))+'</mark>';from=at+query.length}return result+safe(title.slice(from))}

function openConversationSearch(trigger){closeFloats();searchTrigger=trigger;conversationQuery.value='';renderConversationResults();conversationSearch.showModal();conversationQuery.focus()}
document.querySelector('#search-field-icon').innerHTML=icon('search');
conversationQuery.oninput=event=>{if(!event.isComposing&&!searchComposing)renderConversationResults()};conversationQuery.addEventListener('compositionstart',()=>searchComposing=true);conversationQuery.addEventListener('compositionend',()=>{searchComposing=false;renderConversationResults()});conversationQuery.onkeydown=event=>{if(event.isComposing||searchComposing||event.keyCode===229)return;if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();activateSearchResult(searchActive+(event.key==='ArrowDown'?1:-1))}if(event.key==='Enter'){event.preventDefault();if(searchMatches[searchActive])selectSearchResult(searchMatches[searchActive])}};
conversationSearch.addEventListener('click',event=>{if(event.target!==conversationSearch)return;const r=conversationSearch.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)conversationSearch.close()});conversationSearch.addEventListener('close',()=>searchTrigger?.focus());

const deleteDialog=document.querySelector('#session-delete');let pendingDelete=null,deleteReturnFocus=null;
icons.x='M18 6 6 18 M6 6l12 12';deleteDialog.querySelector('.delete-close').innerHTML=icon('x');tip(deleteDialog.querySelector('.delete-close'),'关闭删除确认');
function bindSessionContextMenu(row,session){row.addEventListener('contextmenu',event=>{event.preventDefault();event.stopPropagation();showMenu(session,row,{x:event.clientX,y:event.clientY})})}
function openSessionDelete(session,origin){closeFloats();pendingDelete=session;deleteReturnFocus=origin;deleteDialog.querySelector('.delete-confirm-button').disabled=false;deleteDialog.showModal();deleteDialog.querySelector('.delete-cancel').focus()}
function confirmSessionDelete(){if(!pendingDelete)return;const target=pendingDelete;deleteDialog.querySelector('.delete-confirm-button').disabled=true;const ids=new Set([target.id]);let changed=true;while(changed){changed=false;for(const s of [...sessions,...searchExamples])if(s.parentSessionId&&ids.has(s.parentSessionId)&&!ids.has(s.id)){ids.add(s.id);changed=true}}for(const collection of [sessions,searchExamples])for(let i=collection.length-1;i>=0;i--)if(ids.has(collection[i].id))collection.splice(i,1);if(document.querySelector('#main-title').textContent===target.title){document.querySelector('#main-title').textContent='新对话';document.querySelector('#main-copy').textContent='会话归属：对话'}render();if(conversationSearch.open)renderConversationResults();deleteDialog.close('deleted');say('示例对话及其子智能体对话已删除')}
deleteDialog.querySelector('.delete-confirm-button').onclick=confirmSessionDelete;deleteDialog.querySelector('.delete-cancel').onclick=()=>deleteDialog.close('cancel');deleteDialog.querySelector('.delete-close').onclick=()=>deleteDialog.close('cancel');deleteDialog.addEventListener('close',()=>{pendingDelete=null;const origin=deleteReturnFocus;deleteReturnFocus=null;if(origin?.isConnected)origin.focus();else if(conversationSearch.open)conversationQuery.focus();else document.querySelector('.search-trigger')?.focus()});


function newChatInProject(project){closeFloats();document.querySelector('#main-title').textContent='新对话';document.querySelector('#main-copy').textContent='会话归属：'+project.name}
function showProjectMenu(project,row){closeFloats();menu=document.createElement('div');menu.className='float menu';menu.role='menu';menu.dataset.kind='project-menu';menu.append(item('重命名','pencil',()=>openProjectEdit(project,row)),item('编辑项目…','folder-closed',()=>openProjectEdit(project,row)),item(project.pinned?'取消置顶':'置顶',project.pinned?'pin-off':'pin',()=>toggleProjectPin(project)),item('在此项目下新建对话','pencil',()=>newChatInProject(project)),item('在 Finder 中打开','folder-open',()=>{closeFloats();say('脱敏预览不访问本机文件夹')}),document.createElement('hr'),item('删除项目','trash-2',()=>openProjectDelete(project,row),true));document.body.append(menu);placeCard(menu,row);menu.querySelector('button').focus()}
const projectDeleteDialog=document.querySelector('#project-delete');let pendingProjectDelete=null,projectDeleteOrigin=null,projectDeleteBusy=false;
projectDeleteDialog.querySelector('.delete-close').innerHTML=icon('x');tip(projectDeleteDialog.querySelector('.delete-close'),'关闭删除确认');
function openProjectDelete(project,origin){closeFloats();pendingProjectDelete=project;projectDeleteOrigin=origin;projectDeleteBusy=false;projectDeleteDialog.querySelector('.project-delete-error').hidden=true;projectDeleteDialog.querySelectorAll('button').forEach(b=>b.disabled=false);projectDeleteDialog.showModal();projectDeleteDialog.querySelector('.delete-cancel').focus()}
async function confirmProjectDelete(){if(!pendingProjectDelete||projectDeleteBusy)return;projectDeleteBusy=true;projectDeleteDialog.querySelectorAll('button').forEach(b=>b.disabled=true);const project=pendingProjectDelete;try{const all=[...sessions,...searchExamples],affected=new Set(all.filter(s=>s.project===project.id).map(s=>s.id));let expanded=true;while(expanded){expanded=false;for(const session of all)if(session.parentSessionId&&affected.has(session.parentSessionId)&&!affected.has(session.id)){affected.add(session.id);expanded=true}}const records=all.filter(s=>affected.has(s.id));await Promise.resolve();if(records.some(s=>s.stopFails))throw new Error('未能停止项目中的对话，请重试。项目和对话记录均已保留。');for(const session of records){if(session.running)session.running=false;session.project=null}projects.splice(projects.indexOf(project),1);sections.conversations=true;render();if(conversationSearch.open)renderConversationResults();if(records.some(s=>s.title===document.querySelector('#main-title').textContent)||document.querySelector('#main-copy').textContent==='会话归属：'+project.name)document.querySelector('#main-copy').textContent='会话归属：对话';projectDeleteDialog.close('deleted');say('示例项目已删除，运行中的对话已停止；对话记录和源文件夹均已保留')}catch(error){const message=projectDeleteDialog.querySelector('.project-delete-error');message.textContent=error.message;message.hidden=false;projectDeleteDialog.querySelectorAll('button').forEach(b=>b.disabled=false)}finally{projectDeleteBusy=false}}
projectDeleteDialog.querySelector('.delete-confirm-button').onclick=confirmProjectDelete;for(const selector of ['.delete-cancel','.delete-close'])projectDeleteDialog.querySelector(selector).onclick=()=>{if(!projectDeleteBusy)projectDeleteDialog.close('cancel')};projectDeleteDialog.addEventListener('cancel',event=>{if(projectDeleteBusy)event.preventDefault()});projectDeleteDialog.addEventListener('close',()=>{pendingProjectDelete=null;if(projectDeleteOrigin?.isConnected)projectDeleteOrigin.focus();else document.querySelector('.search-trigger')?.focus();projectDeleteOrigin=null});

const moveCreateDialog=document.querySelector('#move-create-project'),moveProjectName=document.querySelector('#move-project-name'),moveSourceList=document.querySelector('#move-source-folders');
const demoSourceFolders=['/Users/demo/Projects/new-project-demo','/Users/demo/Projects/shared-sample','/Users/demo/Projects/docs-sample'];let moveSourceSession=null,moveCreateOrigin=null,moveFolderDraft=[],movePrimaryPath=null,editingProject=null;
moveCreateDialog.querySelector('.move-create-close').innerHTML=icon('x');moveCreateDialog.querySelector('.project-name-icon').innerHTML=icon('folder-closed');tip(moveCreateDialog.querySelector('.move-create-close'),'关闭创建项目');
function updateMoveCreateValidity(){moveCreateDialog.querySelector('.move-create-submit').disabled=!moveProjectName.value.trim()||!moveFolderDraft.length||!movePrimaryPath}
function addDemoSourceFolder(){const next=demoSourceFolders.find(p=>!moveFolderDraft.includes(p));if(!next)return;moveFolderDraft.push(next);if(!movePrimaryPath)movePrimaryPath=next;renderMoveSourceFolders()}
function renderMoveSourceFolders(){moveSourceList.replaceChildren();if(!moveFolderDraft.length){const empty=document.createElement('button');empty.type='button';empty.className='add-source-empty';empty.innerHTML=icon('folder-open')+'<span>添加可读取和编辑的文件夹</span>';empty.onclick=addDemoSourceFolder;moveSourceList.append(empty)}else{const list=document.createElement('div');list.className='source-list';for(const path of moveFolderDraft){const row=document.createElement('div');row.className='source-folder';const primary=path===movePrimaryPath;row.innerHTML=icon('folder-closed')+'<div class="folder-info"><span>'+safe(path.split('/').pop())+'</span><span class="folder-path-text">'+safe(path)+'</span></div>'+(primary?'<span class="source-primary">主要</span>':'<span class="make-primary-slot"><button type="button" class="make-primary">设为主要</button></span>')+'<button type="button" class="icon-button remove-source">'+icon('x')+'</button>';const set=row.querySelector('.make-primary');if(set)set.onclick=()=>{movePrimaryPath=path;renderMoveSourceFolders()};const remove=row.querySelector('.remove-source');tip(remove,'移除文件夹');remove.onclick=()=>{moveFolderDraft=moveFolderDraft.filter(p=>p!==path);if(movePrimaryPath===path)movePrimaryPath=moveFolderDraft[0]||null;renderMoveSourceFolders()};list.append(row)}const add=document.createElement('button');add.type='button';add.className='add-source';add.innerHTML=icon('folder-open')+'<span>添加文件夹</span>';add.disabled=moveFolderDraft.length===demoSourceFolders.length;add.onclick=addDemoSourceFolder;list.append(add);moveSourceList.append(list)}updateMoveCreateValidity()}
function openMoveProjectCreate(session,origin){closeFloats();editingProject=null;document.querySelector('#move-create-title').textContent='创建项目';moveCreateDialog.querySelector('.move-create-submit').textContent='创建项目';moveSourceSession=session;moveCreateOrigin=origin;moveFolderDraft=[];movePrimaryPath=null;moveProjectName.value='';document.querySelector('#move-create-error').hidden=true;renderMoveSourceFolders();moveCreateDialog.showModal();moveProjectName.focus()}
function openProjectEdit(project,origin){closeFloats();editingProject=project;moveSourceSession=null;moveCreateOrigin=origin;moveFolderDraft=[...project.folders];movePrimaryPath=project.primaryFolder||project.folders[0];moveProjectName.value=project.name;document.querySelector('#move-create-title').textContent='编辑项目';moveCreateDialog.querySelector('.move-create-submit').textContent='保存';document.querySelector('#move-create-error').hidden=true;renderMoveSourceFolders();moveCreateDialog.showModal();moveProjectName.focus()}
moveProjectName.oninput=updateMoveCreateValidity;moveCreateDialog.querySelector('.move-create-close').onclick=()=>moveCreateDialog.close('cancel');moveCreateDialog.querySelector('.move-create-cancel').onclick=()=>moveCreateDialog.close('cancel');moveCreateDialog.querySelector('form').onsubmit=event=>{event.preventDefault();if(editingProject){if(!moveProjectName.value.trim()||!moveFolderDraft.length)return;editingProject.name=moveProjectName.value.trim();editingProject.folders=[...moveFolderDraft];editingProject.primaryFolder=movePrimaryPath;render();moveCreateDialog.close('saved');say('示例项目已更新');return}if(!moveSourceSession||!moveProjectName.value.trim()||!moveFolderDraft.length)return;const source=moveSourceSession;moveCreateDialog.querySelector('.move-create-submit').disabled=true;let target=projects.find(p=>(p.primaryFolder||p.folders[0])===movePrimaryPath);const reused=!!target;if(!target){target={id:'created-demo-'+(projects.length+1),name:moveProjectName.value.trim(),folders:[...moveFolderDraft],primaryFolder:movePrimaryPath,pinned:false,expanded:true};projects.push(target)}source.project=target.id;render();if(conversationSearch.open)renderConversationResults();if(document.querySelector('#main-title').textContent===source.title)document.querySelector('#main-copy').textContent='会话归属：'+target.name;moveCreateDialog.close('created');say((reused?'已移入已有项目：':'项目已创建，原对话已移入：')+target.name+'，置顶状态保持不变')};moveCreateDialog.addEventListener('close',()=>{moveSourceSession=null;editingProject=null;const origin=moveCreateOrigin;moveCreateOrigin=null;if(origin?.isConnected)origin.focus();else if(conversationSearch.open)conversationQuery.focus();else document.querySelector('.search-trigger')?.focus()});

render();
</script>
