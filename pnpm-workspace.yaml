packages:
  - apps/*
  - packages/*

nodeLinker: hoisted
autoInstallPeers: false
saveExact: true

# strictDepBuilds 默认开启：未裁决的安装脚本会让安装失败。逐个放行或拒绝。
allowBuilds:
  electron: true
  koffi: false
  protobufjs: false
  '@google/genai': false

# 不把第三方包附带的 Agent skills 链接进仓库。
permissions:
  '@logtape/logtape':
    skills: false

overrides:
  '@earendil-works/pi-agent-core': 1.4.0
  '@earendil-works/pi-ai': 1.4.0
  '@earendil-works/pi-mcp': 1.4.0
  '@earendil-works/pi-telemetry': 1.4.0
  'typebox': 1.3.27
  'shiki': 4.5.0
  'katex': 0.16.47
  'mermaid': 11.17.2
