<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全局 4px 滚动条预览</title>
<style>
/* Offline preview snapshot of the shared theme tokens and scrollbar rules. */
:root {
  --layer-menu: 50;
  --layer-menu-submenu: 51;
  --palette-white: #ffffff;
  --palette-gray-25: rgb(250 250 250);
  --palette-gray-50: rgb(249 250 251);
  --palette-gray-100: rgb(235 238 242);
  --palette-gray-300: rgb(207 211 214);
  --palette-gray-400: rgb(173 178 184);
  --palette-gray-500: rgb(129 133 140);
  --palette-gray-600: rgb(97 102 107);
  --palette-gray-700: rgb(67 69 74);
  --palette-gray-750: rgb(53 54 56);
  --palette-gray-800: rgb(44 44 46);
  --palette-gray-830: rgb(41 41 41);
  --palette-gray-850: rgb(35 35 36);
  --palette-gray-900: rgb(27 27 28);
  --palette-gray-950: rgb(21 21 23);
  --palette-ink: rgb(15 17 21);
  --palette-blue-50: rgb(237 243 254);
  --palette-blue-500: rgb(65 118 230);
  --palette-blue-300: rgb(122 170 255);
  --palette-red-500: rgb(236 19 19);
  --palette-red-300: rgb(242 90 90);
  --palette-green-500: rgb(34 197 94);
  --palette-amber-500: rgb(245 158 11);
  /* 文字用的深色（亮色主题，对白色约 5:1 以上）与浅色（暗色主题）：成功、警告文字与终端的 ANSI 颜色。 */
  --palette-red-700: rgb(185 28 28);
  --palette-red-400: rgb(248 113 113);
  --palette-green-700: rgb(21 128 61);
  --palette-green-400: rgb(74 222 128);
  --palette-amber-700: rgb(180 83 9);
  --palette-amber-400: rgb(251 191 36);
  --palette-yellow-700: rgb(161 98 7);
  --palette-yellow-400: rgb(250 204 21);
  --palette-blue-700: rgb(29 78 216);
  --palette-blue-400: rgb(96 165 250);
  --palette-fuchsia-700: rgb(162 28 175);
  --palette-fuchsia-400: rgb(232 121 249);
  --palette-cyan-700: rgb(14 116 144);
  --palette-cyan-400: rgb(34 211 238);
  --palette-green-bg-light: rgb(230 244 231);
  --palette-green-bg-dark: rgb(31 49 36);
  --palette-red-bg-light: rgb(252 230 226);
  --palette-red-bg-dark: rgb(60 31 27);
  --palette-ink-a04: rgb(0 0 0 / 0.04);
  --palette-ink-a08: rgb(0 0 0 / 0.08);
  --palette-ink-a10: rgb(0 0 0 / 0.1);
  --palette-ink-a12: rgb(0 0 0 / 0.12);
  --palette-ink-a16: rgb(0 0 0 / 0.16);
  --palette-ink-a24: rgb(0 0 0 / 0.24);
  --palette-ink-a50: rgb(0 0 0 / 0.5);
  --palette-slate-a06: rgb(38 49 72 / 0.06);
  --palette-slate-a10: rgb(38 49 72 / 0.1);
  --palette-white-a06: rgb(255 255 255 / 0.06);
  --palette-white-a08: rgb(255 255 255 / 0.08);
  --palette-white-a12: rgb(255 255 255 / 0.12);
  --palette-white-a14: rgb(255 255 255 / 0.14);
  --palette-white-a16: rgb(255 255 255 / 0.16);
  --palette-white-a20: rgb(255 255 255 / 0.2);
  --palette-menu-light: rgb(248 249 250 / 0.94);
  --palette-menu-dark: rgb(48 49 54 / 0.94);
  --palette-shadow-a02: rgb(0 0 0 / 0.02);
  --palette-shadow-a03: rgb(0 0 0 / 0.03);
  --palette-shadow-a04: rgb(0 0 0 / 0.04);
  --palette-shadow-a05: rgb(0 0 0 / 0.05);
}
:root {
  color-scheme: light;
  --background: var(--palette-white);
  --foreground: var(--palette-ink);
  --card: var(--palette-white);
  --card-foreground: var(--palette-ink);
  --card-fill: var(--palette-white);
  --card-stroke: var(--palette-ink-a16);
  --popover: var(--palette-white);
  --popover-foreground: var(--palette-ink);
  --primary: var(--palette-ink);
  --primary-hover: var(--palette-gray-700);
  --primary-foreground: var(--palette-white);
  --secondary: var(--palette-slate-a06);
  --secondary-foreground: var(--palette-ink);
  --muted: var(--palette-gray-50);
  --muted-foreground: var(--palette-gray-600);
  --accent: var(--palette-slate-a06);
  --accent-active: var(--palette-slate-a10);
  --accent-foreground: var(--palette-ink);
  --destructive: var(--palette-red-500);
  --destructive-foreground: var(--palette-white);
  --success: var(--palette-green-500);
  --warning: var(--palette-amber-500);
  /* 正文大小的成功、警告文字（--success / --warning 用于图标与填充，作文字时对比度不足）。 */
  --success-text: var(--palette-green-700);
  --warning-text: var(--palette-amber-700);
  /* 终端输出的 ANSI 前景色（两套主题下对背景都不低于 4.5:1）。 */
  --terminal-red: var(--palette-red-700);
  --terminal-green: var(--palette-green-700);
  --terminal-yellow: var(--palette-yellow-700);
  --terminal-blue: var(--palette-blue-700);
  --terminal-magenta: var(--palette-fuchsia-700);
  --terminal-cyan: var(--palette-cyan-700);
  --terminal-muted: var(--palette-gray-600);
  --border: var(--palette-ink-a10);
  --border-subtle: var(--palette-ink-a04);
  --input: var(--palette-ink-a12);
  --ring: var(--palette-blue-500);
  --link: var(--palette-blue-500);
  --overlay: var(--palette-ink-a24);
  --menu-fill: var(--palette-white);
  --elevation-stroke-color: var(--palette-ink-a16);
  --sidebar: var(--palette-gray-50);
  --sidebar-foreground: var(--palette-ink);
  --sidebar-accent: var(--palette-gray-100);
  --sidebar-accent-foreground: var(--palette-ink);
  --sidebar-border: var(--palette-ink-a10);
  --bubble: var(--palette-blue-50);
  --tooltip: var(--palette-gray-800);
  --tooltip-foreground: var(--palette-gray-50);
  --toast: var(--palette-gray-750);
  --toast-foreground: var(--palette-gray-50);
  --code-block: var(--palette-gray-50);
  --inline-code: var(--palette-gray-25);
  --diff-added: var(--palette-green-bg-light);
  --diff-deleted: var(--palette-red-bg-light);
  --skeleton: var(--palette-ink-a04);
  --scrollbar-thumb: var(--palette-ink-a08);
  --scrollbar-thumb-hover: var(--palette-ink-a16);
  --scrollbar-thumb-active: var(--palette-ink-a24);
  --shadow-color-1: var(--palette-shadow-a03);
  --shadow-color-2: var(--palette-shadow-a02);
  --shadow-color-3: var(--palette-shadow-a04);
  --shadow-color-4: var(--palette-shadow-a05);
}
:root {
  --hairline: 0.5px;
  --frame-top-clearance: 48px;
  --frame-leading-clearance: 0px;
  --focus-ring-width: 2px;
  --scrollbar-size: 4px;
  --scrollbar-radius: 2px;
  --scrollbar-end-gap: 2px;
  --menu-backdrop-filter: blur(40px) saturate(150%);
  --elevation-stroke: 0 0 0 var(--hairline) var(--elevation-stroke-color);
}
.dark {
  color-scheme: dark;
  --background: var(--palette-gray-950);
  --foreground: var(--palette-gray-50);
  --card: var(--palette-gray-800);
  --card-foreground: var(--palette-gray-50);
  --card-fill: var(--palette-gray-800);
  --card-stroke: var(--palette-white-a20);
  --popover: var(--palette-gray-850);
  --popover-foreground: var(--palette-gray-50);
  --primary: var(--palette-gray-50);
  --primary-hover: var(--palette-gray-100);
  --primary-foreground: var(--palette-ink);
  --secondary: var(--palette-white-a08);
  --secondary-foreground: var(--palette-gray-50);
  --muted: var(--palette-gray-900);
  --muted-foreground: var(--palette-gray-300);
  --accent: var(--palette-white-a08);
  --accent-active: var(--palette-white-a14);
  --accent-foreground: var(--palette-gray-50);
  --destructive: var(--palette-red-300);
  --destructive-foreground: var(--palette-ink);
  --success-text: var(--palette-green-400);
  --warning-text: var(--palette-amber-400);
  --terminal-red: var(--palette-red-400);
  --terminal-green: var(--palette-green-400);
  --terminal-yellow: var(--palette-yellow-400);
  --terminal-blue: var(--palette-blue-400);
  --terminal-magenta: var(--palette-fuchsia-400);
  --terminal-cyan: var(--palette-cyan-400);
  --terminal-muted: var(--palette-gray-400);
  --border: var(--palette-white-a12);
  --border-subtle: var(--palette-white-a06);
  --input: var(--palette-white-a16);
  --ring: var(--palette-blue-300);
  --link: var(--palette-blue-300);
  --overlay: var(--palette-ink-a50);
  --menu-fill: var(--palette-menu-dark);
  --elevation-stroke-color: var(--palette-white-a16);
  --sidebar: var(--palette-gray-900);
  --sidebar-foreground: var(--palette-gray-50);
  --sidebar-accent: var(--palette-gray-700);
  --sidebar-accent-foreground: var(--palette-gray-50);
  --sidebar-border: var(--palette-white-a12);
  --bubble: var(--palette-gray-800);
  --tooltip: var(--palette-gray-700);
  --tooltip-foreground: var(--palette-gray-50);
  --toast: var(--palette-gray-700);
  --toast-foreground: var(--palette-gray-50);
  --code-block: var(--palette-gray-900);
  --inline-code: var(--palette-gray-830);
  --diff-added: var(--palette-green-bg-dark);
  --diff-deleted: var(--palette-red-bg-dark);
  --skeleton: var(--palette-white-a08);
  --scrollbar-thumb: var(--palette-white-a12);
  --scrollbar-thumb-hover: var(--palette-white-a16);
  --scrollbar-thumb-active: var(--palette-white-a20);
}
  /* 非 WebKit 引擎的共享回退。Chromium 下由下方伪元素固定为 4px。 */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--scrollbar-thumb) transparent;
  }

  @supports selector(::-webkit-scrollbar) {
    /* 非 auto 的标准属性会接管 Chromium 滚动条，覆盖伪元素的精确几何。 */
    * {
      scrollbar-width: auto;
      scrollbar-color: auto;
    }
    ::-webkit-scrollbar {
      width: var(--scrollbar-size);
      height: var(--scrollbar-size);
      background: transparent;
    }
    ::-webkit-scrollbar-track {
      margin: var(--scrollbar-end-gap);
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background-color: var(--scrollbar-thumb);
      border-radius: var(--scrollbar-radius);
      corner-shape: round;
    }
    ::-webkit-scrollbar-thumb:active {
      background-color: var(--scrollbar-thumb-active);
    }
    ::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }
    ::-webkit-scrollbar-corner {
      background: transparent;
    }
    @media (hover: hover) {
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--scrollbar-thumb-hover);
      }
      ::-webkit-scrollbar-thumb:active {
        background-color: var(--scrollbar-thumb-active);
      }
    }
  }

  /* 主体滚动容器始终预留滚动条槽位，内容从不满一屏变为溢出时不改变内容宽度。
     只对 block 方向的滚动条生效；overlay 滚动条不占位，规范下该声明无效。 */
  [data-scroll-stable] {
    scrollbar-gutter: stable;
  }


*{box-sizing:border-box}
body{margin:0;padding:40px;background:var(--background);color:var(--foreground);font:13px/20px "Noto Sans SC",system-ui,sans-serif}
main{max-width:960px;margin:auto}header{display:flex;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:16px;line-height:24px;font-weight:500;margin:0;flex:1}button{font:inherit;height:28px;padding:0 12px;border:0;border-radius:8px;background:var(--accent);color:var(--foreground);cursor:pointer}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
p{margin:0 0 24px;color:var(--muted-foreground)}.samples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.sample h2{font-size:13px;font-weight:500;margin:0 0 8px}.viewport{height:280px;width:100%;overflow:auto;border-radius:16px;background:var(--sidebar);outline:.5px solid var(--border)}.content{padding:12px;min-height:720px}.content div{height:32px;line-height:32px;color:var(--muted-foreground)}.both .content{width:640px}.both .content div{white-space:nowrap}.nested{height:280px;overflow:auto;padding:12px;border-radius:16px;background:var(--sidebar);outline:.5px solid var(--border)}.nested .viewport{height:148px;background:var(--background);margin-bottom:12px}.note{font-size:12px;line-height:18px;margin:24px 0;color:var(--muted-foreground)}
@media(max-width:700px){body{padding:16px}.samples{grid-template-columns:1fr}}
</style>
<main><header><h1>全局滚动条 · 4px 圆角</h1><button type="button" id="theme" aria-pressed="false">切换深色</button></header><p>滚动内容，或拖动右侧与底部的滑块。悬停和拖动仅加深颜色，宽度保持 4px。</p><section class="samples"><div class="sample"><h2>纵向列表</h2><div class="viewport" id="vertical" tabindex="0" aria-label="纵向列表"><div class="content"></div></div></div><div class="sample"><h2>纵向与横向</h2><div class="viewport both" id="both" tabindex="0" aria-label="双向滚动区域"><div class="content"></div></div></div><div class="sample"><h2>嵌套滚动容器</h2><div class="nested" id="nested" tabindex="0" aria-label="外层滚动区域"><div class="viewport" id="inner" tabindex="0" aria-label="内层滚动区域"><div class="content"></div></div><div class="content"></div></div></div></section><div class="note">透明轨道 · 半圆端点 R2 · 无箭头 · 浅色 / 深色主题共用规则</div></main>
<script>
document.querySelectorAll('.content').forEach((el,index)=>{for(let i=0;i<24;i++){const row=document.createElement('div');row.textContent=index===1?'示例内容 '+(i+1)+' · 用于核对横向滚动与右侧内容的可达性':'示例内容 '+(i+1);el.append(row)}});
document.querySelector('#theme').onclick=event=>{const dark=document.documentElement.classList.toggle('dark');event.currentTarget.setAttribute('aria-pressed',String(dark));event.currentTarget.textContent=dark?'切换浅色':'切换深色'};
</script>
</html>
